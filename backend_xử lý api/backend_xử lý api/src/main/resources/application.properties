spring.application.name=busmap2
server.port=8080
server.address=192.160.16.100
# Địa chỉ kết nối tới MySQL trong XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/bus_map?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC

# Tên đăng nhập của MySQL trong XAMPP (thường mặc định là root)
spring.datasource.username=root

# Mật khẩu của MySQL trong XAMPP (thường mặc định là rỗng)
spring.datasource.password=
# Cấu hình Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Kích hoạt logging SQL
spring.jpa.show-sql=true

# Format SQL đẹp
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
